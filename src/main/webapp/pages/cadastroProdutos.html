<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/color.css">
    <link rel="stylesheet" href="../css/cadastroProdutos.css">
</head>
<body>
<header id="header">
    <h1 id="tituloCadastro">Cadastro de Produto</h1>
    <nav id="menu">
        <ul class="menu-lista">
            <li><a href="dashboard.html">Início</a></li>
            <li><a href="#">Gerenciamento</a></li>
            <li><a href="cadastro.html" class="btn-menu">Cadastro</a></li>
        </ul>
    </nav>
</header>
<main>
    <section id="form-container">
        <form action="../cadastroProdutos" method="POST" id="formCadastro">
            <div class="linha-form">
                <div class="grupo-form">
                    <label>Código de Barras</label>
                    <input type="text" name="codigoBarras" required>
                </div>
                <div class="grupo-form">
                    <label>Nome do Produto</label>
                    <input type="text" name="nomeProduto" required>
                </div>
            </div>
            <div class="linha-form">
                <div class="grupo-form">
                    <label>Fabricante</label>
                    <input type="text" name="fabricante">
                </div>
                <div class="grupo-form">
                    <label>Marca</label>
                    <input type="text" name="marca">
                </div>
            </div>
            <div class="linha-form">
                <div class="grupo-form">
                    <label>Data de Fabricação</label>
                    <input type="date" name="dataFabricacao">
                </div>
                <div class="grupo-form">
                    <label>Data de Vencimento</label>
                    <input type="date" name="dataVencimento">
                </div>
            </div>
            <div class="linha-form">
                <div class="grupo-form">
                    <label>Quantidade</label>
                    <input type="number" name="quantidade" id="quantidade">
                </div>
                <div class="grupo-form">
                    <label>Valor Unitário</label>
                    <input type="number" step="0.01" name="valor" id="valor">
                </div>
            </div>
            <div class="linha-form">
                <div class="grupo-form full">
                    <label>Total</label>
                    <input type="number" name="total" id="total" readonly>
                </div>
            </div>
            <div class="linha-form">
                <div class="grupo-form full">
                    <label>Status</label>
                    <select name="status">
                            <option value="">Selecione o status</option>
                            <option value="entrada">Entrada</option><!--Alterar o valor para entrada-->
                            <option value="saida">Saída</option><!--Alterar o valor para entrada-->
                    </select>
                </div>
            </div>
            <div class="acoes-form">
                <button type="submit" class="btn-salvar">Salvar</button>
                <a href="dashboard.html" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </section>
</main>
<script src="../js/cadastroProdutos.js"></script>
</body>
</html>
